name: Build TipSeek for Linux

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04  # 改用 22.04，兼顾兼容性和免排队

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    # 补充可能缺失的系统依赖库，防止编译失败
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

    - name: Build Release
      run: cargo build --release

    - name: Upload Binary
      uses: actions/upload-artifact@v4
      with:
        name: tipseek-linux-binary
        path: target/release/tipseek
